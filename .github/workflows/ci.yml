name: CI

on:
  push:
    branches: [main]
    paths:
      - 'kiranam-admin/**'
  pull_request:
    branches: [main]
    paths:
      - 'kiranam-admin/**'

jobs:
  admin-checks:
    name: kiranam-admin lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiranam-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiranam-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
