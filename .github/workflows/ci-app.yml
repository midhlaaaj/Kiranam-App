name: CI (kiranam-app)

on:
  push:
    branches: [main]
    paths:
      - 'kiranam-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'kiranam-app/**'

jobs:
  app-checks:
    name: kiranam-app lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiranam-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiranam-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
