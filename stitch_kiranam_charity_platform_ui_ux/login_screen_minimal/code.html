<style>
        body {

<body class="bg-surface text-on-surface flex items-center justify-center min-h-screen p-margin-mobile md:p-0">
<div class="w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Logo Anchor -->
<div class="mb-lg flex flex-col items-center animate-fade-in">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-on-primary-container !text-[32px]" data-icon="volunteer_activism">volunteer_activism</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Kiranam</h1>
</div>
<!-- Login Card -->
<div class="login-card bg-surface-container-lowest w-full rounded-lg p-md md:p-lg">
<header class="text-center mb-lg">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface font-light tracking-tight mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-secondary">Sign in to continue your journey</p>
</header>
<form class="space-y-md" onsubmit="return false;">
<!-- Email/Phone Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="identity">Email or Phone</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT px-md py-4 font-body-md text-body-md focus:ring-1 focus:ring-primary input-glow transition-all duration-200 outline-none" id="identity" placeholder="Enter your email or phone number" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-secondary opacity-50" data-icon="mail">mail</span>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT px-md py-4 font-body-md text-body-md focus:ring-1 focus:ring-primary input-glow transition-all duration-200 outline-none" id="password" placeholder="Enter your password" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-secondary opacity-50 cursor-pointer" data-icon="visibility" id="togglePassword">visibility</span>
</div>
</div>
<!-- Primary Login Action -->
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-full shadow-[0px_8px_30px_rgba(187,0,22,0.15)] hover:opacity-90 active:scale-[0.98] transition-all duration-200 mt-base" type="submit">
                    Login
                </button>
</form>
<!-- Divider -->
<div class="relative my-lg flex items-center">
<div class="flex-grow border-t border-[#F1F1F1]"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-secondary uppercase tracking-widest">or</span>
<div class="flex-grow border-t border-[#F1F1F1]"></div>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-low border-none py-4 rounded-full font-label-md text-label-md text-on-surface hover:bg-surface-container-highest active:scale-[0.98] transition-all duration-200">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwWMiC7a0EG0jIHgHB-fv9otsoUypny9WBeRotCtLb4XPK0obpbd3p1Q2PHRvfJNDxK9Q1O_TlAxKPl3zqzRJKdujJ8S2XqrKWP2AJj9xY8yUWbUEASEKRhLL_VA7-XkxYRdWQmMpy94C5c_X4aOJEhXIiuKJh73ZvyZbiO-PIFeYdgiNNX2G6D2iqem6-sjrFb8ABCYiZAOHN80FeNfcNh1gO8tMe_JF9joD0V19yykpi5v2LlYVUbuFmgMYIwCTO1JtGDXOuLtnk"/>
                Continue with Google
            </button>
</div>
<!-- Secondary Actions -->
<div class="mt-lg flex flex-col items-center space-y-md w-full">
<p class="font-body-md text-body-md text-secondary">
                Don't have an account? 
                <a class="text-primary font-semibold hover:underline" href="#">Register</a>
</p>
<a class="flex items-center gap-2 group px-md py-3 rounded-lg hover:bg-white/50 transition-all duration-300" href="#">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="favorite">favorite</span>
<span class="font-label-md text-label-md text-secondary group-hover:text-on-surface transition-colors">Become a Volunteer</span>
</a>
</div>
<!-- Background Aesthetic Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[5%] w-[400px] h-[400px] bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute bottom-0 right-0 w-[300px] h-[300px] bg-surface-container-high rounded-full blur-3xl opacity-60"></div>
</div>
</div>
<script>
        // Micro-interaction for password toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleBtn.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Simple button active state visual feedback
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => button.style.transform = 'scale(0.97)');
            button.addEventListener('mouseup', () => button.style.transform = 'scale(1)');
            button.addEventListener('mouseleave', () => button.style.transform = 'scale(1)');
        });
    </script>
