<style>
        body { background-color: #f6faff; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .active-pill { background-color: #bb0016 !important; color: white !important; }
        .active-card { border: 2px solid #bb0016 !important; background-color: #ffffff !important; }
        .custom-shadow { box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04); }
        input:focus { outline: none; }
    </style>

    body {
      min-height: max(884px, 100dvh);

<body class="font-body-md text-on-surface">
<!-- Top AppBar -->
<header class="w-full top-0 sticky bg-surface z-50 shadow-sm flex justify-between items-center px-margin-mobile md:px-margin-desktop py-sm">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-primary" data-icon="volunteer_activism">volunteer_activism</span>
<h1 class="font-display-lg text-headline-md text-primary">Kiranam</h1>
</div>
<div class="flex items-center gap-md">
<button class="material-symbols-outlined p-base rounded-full hover:bg-surface-container-low transition-colors" data-icon="notifications">notifications</button>
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional close-up portrait of a cheerful person with soft, natural lighting, reflecting a warm and trustworthy personality. The background is a clean, blurred office space in soft blue and white tones, matching a high-end digital interface aesthetic. The image is crisp, modern, and conveys a sense of reliability and community involvement." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAaBP2i8UrbCWcSMW-iS6c7634t2E8CwXEpE0qsHXmj5RZQeG1DcINpKA1gMNHpM_z0aIvLfUOSulFQWml_auEQc98lY6eL3rA21lFVR0pY-AL98Wj6eGUHKLTurptXJgY79WH5RCcysfrFJ6Gx-jWGR-CGhCCmM1mjgtrZndPUUmNPPJxVV-z8MXUz7IPIQlIlf1UyuDlDuJmfTqBoVUOH5WYgfbHLnuk0TUgsU3ZhXPXwiAbhngGdFNX4Bn_Gx4I3sIP5cumBZxM"/>
</div>
</div>
</header>
<main class="max-w-4xl mx-auto px-margin-mobile md:px-margin-desktop py-lg pb-xl">
<!-- Header Section -->
<section class="mb-lg">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg mb-sm">Make a Difference</h2>
<p class="text-secondary font-body-lg max-w-2xl">Your contribution fuels community-led initiatives. Choose a plan that fits your impact goals.</p>
</section>
<!-- Contribution Types (Asymmetric Layout) -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-gutter mb-lg">
<!-- Monthly Card -->
<button class="type-card group flex flex-col items-start p-md bg-surface-container-lowest rounded-lg custom-shadow text-left border-2 border-transparent transition-all active:scale-95 duration-150 active-card" onclick="selectType('monthly', this)">
<div class="p-sm bg-primary-container/10 rounded-full mb-sm group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container" data-icon="calendar_month">calendar_month</span>
</div>
<h3 class="font-headline-md text-headline-md mb-xs">Monthly</h3>
<p class="text-secondary font-body-md">Create sustainable, long-term change with regular support.</p>
</button>
<!-- Annual Card -->
<button class="type-card group flex flex-col items-start p-md bg-surface-container-lowest rounded-lg custom-shadow text-left border-2 border-transparent transition-all active:scale-95 duration-150" onclick="selectType('annual', this)">
<div class="p-sm bg-secondary-container rounded-full mb-sm group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-secondary group-hover:text-on-primary-container" data-icon="event_repeat">event_repeat</span>
</div>
<h3 class="font-headline-md text-headline-md mb-xs">Annual</h3>
<p class="text-secondary font-body-md">A powerful yearly commitment to our core mission.</p>
</button>
<!-- One-Time Card -->
<button class="type-card group flex flex-col items-start p-md bg-surface-container-lowest rounded-lg custom-shadow text-left border-2 border-transparent transition-all active:scale-95 duration-150" onclick="selectType('one-time', this)">
<div class="p-sm bg-secondary-container rounded-full mb-sm group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-secondary group-hover:text-on-primary-container" data-icon="favorite">favorite</span>
</div>
<h3 class="font-headline-md text-headline-md mb-xs">One-Time</h3>
<p class="text-secondary font-body-md">Immediate support for our current highest priority needs.</p>
</button>
<!-- Campaign Card -->
<button class="type-card group flex flex-col items-start p-md bg-surface-container-lowest rounded-lg custom-shadow text-left border-2 border-transparent transition-all active:scale-95 duration-150" onclick="selectType('campaign', this)">
<div class="p-sm bg-secondary-container rounded-full mb-sm group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-secondary group-hover:text-on-primary-container" data-icon="campaign">campaign</span>
</div>
<h3 class="font-headline-md text-headline-md mb-xs">Campaign</h3>
<p class="text-secondary font-body-md">Direct your funds to a specific cause or active campaign.</p>
</button>
</section>
<!-- Amount Selection -->
<section class="bg-surface-container-lowest p-md rounded-lg custom-shadow mb-lg">
<h3 class="font-label-md text-label-md text-secondary uppercase tracking-wider mb-md">Select Amount</h3>
<div class="flex flex-wrap gap-sm mb-md">
<button class="amount-chip px-lg py-sm bg-surface-container-low rounded-full font-label-md hover:bg-primary-container/20 transition-all" onclick="selectAmount(10, this)">$10</button>
<button class="amount-chip px-lg py-sm bg-primary active-pill rounded-full font-label-md hover:bg-primary-container/20 transition-all text-on-primary" onclick="selectAmount(25, this)">$25</button>
<button class="amount-chip px-lg py-sm bg-surface-container-low rounded-full font-label-md hover:bg-primary-container/20 transition-all" onclick="selectAmount(50, this)">$50</button>
<button class="amount-chip px-lg py-sm bg-surface-container-low rounded-full font-label-md hover:bg-primary-container/20 transition-all" onclick="selectAmount(100, this)">$100</button>
</div>
<!-- Custom Amount Input -->
<div class="relative group">
<div class="absolute left-md top-1/2 -translate-y-1/2 text-secondary font-headline-md">$</div>
<input class="w-full bg-surface-container-low border-none rounded-full py-md pl-xl pr-md font-headline-md focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-secondary-fixed-dim" id="custom-amount" oninput="handleCustomInput(this)" placeholder="Other amount" type="number"/>
</div>
</section>
<!-- Summary & Action -->
<section class="bg-primary-container/5 p-md rounded-lg border-2 border-primary-container/10 flex flex-col md:flex-row md:items-center justify-between gap-md">
<div>
<p class="text-secondary font-label-sm uppercase tracking-widest mb-xs">Your Summary</p>
<div class="flex items-baseline gap-xs">
<span class="font-headline-lg text-headline-lg text-primary" id="summary-amount">$25.00</span>
<span class="text-secondary font-body-md" id="summary-frequency">/ Monthly</span>
</div>
</div>
<button class="bg-primary text-on-primary px-xl py-md rounded-full font-label-md text-lg hover:brightness-110 active:scale-95 transition-all shadow-lg flex items-center justify-center gap-sm">
                Proceed to Payment
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</section>
</main>
<!-- Bottom Navigation Bar (Shell) -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-lg bg-surface flex justify-around items-center h-16 px-base pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.04)] md:hidden">
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="volunteer_activism" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
<span class="font-label-sm text-label-sm">Campaigns</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-sm text-label-sm">Receipts</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="font-label-sm text-label-sm">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>
<script>
        let currentType = 'Monthly';
        let currentAmount = 25;

        function selectType(type, element) {
            // Update Visuals
            document.querySelectorAll('.type-card').forEach(card => {
                card.classList.remove('active-card');
                const iconDiv = card.querySelector('div');
                iconDiv.classList.replace('bg-primary-container', 'bg-secondary-container');
                card.querySelector('span').classList.replace('text-on-primary-container', 'text-secondary');
            });

            element.classList.add('active-card');
            const iconDiv = element.querySelector('div');
            iconDiv.classList.replace('bg-secondary-container', 'bg-primary-container');
            element.querySelector('span').classList.replace('text-secondary', 'text-on-primary-container');

            // Update State
            currentType = type.charAt(0).toUpperCase() + type.slice(1);
            updateSummary();
        }

        function selectAmount(amount, element) {
            // Update Chips
            document.querySelectorAll('.amount-chip').forEach(chip => {
                chip.classList.remove('active-pill', 'text-on-primary', 'bg-primary');
                chip.classList.add('bg-surface-container-low');
            });
            element.classList.add('active-pill', 'text-on-primary', 'bg-primary');
            element.classList.remove('bg-surface-container-low');

            // Clear custom input
            document.getElementById('custom-amount').value = '';

            // Update State
            currentAmount = amount;
            updateSummary();
        }

        function handleCustomInput(input) {
            // Clear Chips
            document.querySelectorAll('.amount-chip').forEach(chip => {
                chip.classList.remove('active-pill', 'text-on-primary', 'bg-primary');
                chip.classList.add('bg-surface-container-low');
            });

            // Update State
            currentAmount = input.value || 0;
            updateSummary();
        }

        function updateSummary() {
            const amountDisplay = document.getElementById('summary-amount');
            const frequencyDisplay = document.getElementById('summary-frequency');
            
            amountDisplay.innerText = `$${parseFloat(currentAmount).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            
            if(currentType === 'One-time') {
                frequencyDisplay.innerText = ' Donation';
            } else if(currentType === 'Campaign') {
                frequencyDisplay.innerText = ' for Campaign';
            } else {
                frequencyDisplay.innerText = `/ ${currentType}`;
            }
        }

        // Init
        updateSummary();
    </script>
</body></html>
